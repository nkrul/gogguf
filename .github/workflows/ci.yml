name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-26.04-arm, macos-latest, macos-26-intel, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum

      - name: Vet
        shell: bash
        run: go vet ./...

      - name: Test
        shell: bash
        run: go test ./...

      - name: Build CLI
        shell: bash
        run: |
          go build -o /tmp/gogguf ./cmd/gogguf
          go build -o /tmp/tools ./cmd/tools

  integration:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-26.04-arm, macos-latest, macos-26-intel, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum

      - name: Download test model
        shell: bash
        run: |
          mkdir -p models
          curl -L -o models/Qwen3-0.6B-Q8_0.gguf \
            https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf

      - name: Integration tests
        shell: bash
        run: go test -tags=integration ./test/integration/...